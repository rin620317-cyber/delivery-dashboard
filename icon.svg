<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1e42"/>
      <stop offset="100%" stop-color="#08081a"/>
    </radialGradient>
    <radialGradient id="wglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AADFC6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#AADFC6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Wheel glows (rear cx=126,cy=296  front cx=411,cy=296) -->
  <circle cx="126" cy="296" r="88" fill="url(#wglow)"/>
  <circle cx="411" cy="296" r="88" fill="url(#wglow)"/>

  <!-- Bike: translate(21,61) scale(5) — visually centered in 512×512 -->
  <g transform="translate(21,61) scale(5)">
    <!-- Delivery bag (cream / gold) -->
    <rect x="2" y="24" width="16" height="14" rx="2" fill="#F0E6C8" stroke="#C8B870" stroke-width="0.9"/>
    <line x1="2"  y1="31" x2="18" y2="31" stroke="#C8B870" stroke-width="0.7"/>
    <rect x="6"  y="22" width="7"  height="3"  rx="1" fill="#D4C88A"/>
    <!-- Rear wheel -->
    <circle cx="21" cy="47" r="14" fill="none" stroke="#AADFC6" stroke-width="2.2"/>
    <circle cx="21" cy="47" r="2.2" fill="#AADFC6"/>
    <line x1="21" y1="33" x2="21" y2="61" stroke="#AADFC6" stroke-width="0.6" opacity="0.5"/>
    <line x1="7"  y1="47" x2="35" y2="47" stroke="#AADFC6" stroke-width="0.6" opacity="0.5"/>
    <line x1="11" y1="37" x2="31" y2="57" stroke="#AADFC6" stroke-width="0.5" opacity="0.4"/>
    <line x1="31" y1="37" x2="11" y2="57" stroke="#AADFC6" stroke-width="0.5" opacity="0.4"/>
    <!-- Front wheel -->
    <circle cx="78" cy="47" r="14" fill="none" stroke="#AADFC6" stroke-width="2.2"/>
    <circle cx="78" cy="47" r="2.2" fill="#AADFC6"/>
    <line x1="78" y1="33" x2="78" y2="61" stroke="#AADFC6" stroke-width="0.6" opacity="0.5"/>
    <line x1="64" y1="47" x2="92" y2="47" stroke="#AADFC6" stroke-width="0.6" opacity="0.5"/>
    <line x1="68" y1="37" x2="88" y2="57" stroke="#AADFC6" stroke-width="0.5" opacity="0.4"/>
    <line x1="88" y1="37" x2="68" y2="57" stroke="#AADFC6" stroke-width="0.5" opacity="0.4"/>
    <!-- Frame (road bike) -->
    <line x1="47" y1="47" x2="21" y2="47" stroke="#AADFC6" stroke-width="2.2"/>
    <line x1="47" y1="47" x2="45" y2="20" stroke="#AADFC6" stroke-width="2.2"/>
    <line x1="45" y1="20" x2="70" y2="29" stroke="#AADFC6" stroke-width="2.2"/>
    <line x1="70" y1="29" x2="47" y2="47" stroke="#AADFC6" stroke-width="2.2"/>
    <line x1="45" y1="20" x2="21" y2="47" stroke="#AADFC6" stroke-width="1.6"/>
    <line x1="70" y1="29" x2="78" y2="47" stroke="#AADFC6" stroke-width="2.0"/>
    <!-- Saddle -->
    <line x1="39" y1="18" x2="53" y2="18" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round"/>
    <!-- Drop handlebar -->
    <path d="M70 29 C72 22 80 20 82 25 Q83 30 79 30" fill="none" stroke="#d8d8d8" stroke-width="2.1" stroke-linecap="round"/>
    <!-- Crank -->
    <circle cx="47" cy="47" r="3.5" fill="none" stroke="#AADFC6" stroke-width="1.8"/>
    <line x1="41" y1="50" x2="53" y2="44" stroke="#AADFC6" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Gold accent bar at top -->
  <rect x="0" y="0" width="512" height="5" fill="url(#gold)"/>

  <!-- App name -->
  <text x="256" y="452"
        text-anchor="middle"
        font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"
        font-size="58" font-weight="800"
        fill="url(#gold)" opacity="0.95">配達記録</text>
</svg>
